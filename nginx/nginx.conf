# nginx.conf: Next.js(3000), NestJS(3001) 프록시 설정
# /api/* → 3001, 그 외 → 3000
# 보안 및 예외처리, fallback 등 유저 룰 반영
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# 기본 이벤트
 events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server {
        listen       80;
        server_name  localhost;

        # /api/* 프록시 - NestJS
        location /api/ {
            proxy_pass         http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            # 예외처리: Nest 다운 시 fallback
            proxy_intercept_errors on;
            error_page 502 503 504 = @fallback_api;
        }
        location @fallback_api {
            return 503 '{"error":"API temporarily unavailable"}';
            add_header Content-Type application/json;
        }

        # 그 외 프론트엔드(Next.js)
        location / {
            proxy_pass         http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            # 예외처리: Next 다운 시 fallback
            proxy_intercept_errors on;
            error_page 502 503 504 = @fallback_front;
        }
        location @fallback_front {
            return 503 '<html><body><h1>서비스 점검 중입니다.</h1></body></html>';
            add_header Content-Type text/html;
        }
    }
}
