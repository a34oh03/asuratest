; supervisord.conf: nginx, next, nest 프로세스 관리
; 각 프로세스는 예외 발생 시 재시작
[supervisord]
nodaemon=true
; supervisord 자체 로그
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB                    ; 변경됨: 로그 회전용 크기 지정
logfile_backups=3                        ; 변경됨: 백업 파일 개수 지정
loglevel=info                            ; 변경됨: 로깅 레벨

; ----------------------------
; 1) NGINX
; ----------------------------
[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
redirect_stderr=true                     ; stderr도 stdout으로 합침
stdout_logfile=/dev/stdout               ; 변경됨: Docker STDOUT으로 출력
stdout_logfile_maxbytes=0                ; 변경됨: 로그 회전 없이 스트리밍만
stderr_logfile=/dev/stderr               ; 변경됨: Docker STDERR으로 출력

; ----------------------------
; 2) Next.js (frontend)
; ----------------------------
[program:frontend]
directory=/app/frontend
command=pnpm run start
autostart=true
autorestart=true
redirect_stderr=true                     ; stderr도 stdout으로 합침
stdout_logfile=/dev/stdout               ; 변경됨: Docker STDOUT으로 출력
stdout_logfile_maxbytes=0                ; 변경됨: 로그 회전 없이 스트리밍만
stderr_logfile=/dev/stderr               ; 변경됨: Docker STDERR으로 출력
environment=PORT="3000"

; ----------------------------
; 3) NestJS (backend)
; ----------------------------
[program:backend]
directory=/app/backend
command=pnpm run start:prod
autostart=true
autorestart=true
redirect_stderr=true                     ; stderr도 stdout으로 합침
stdout_logfile=/dev/stdout               ; 변경됨: Docker STDOUT으로 출력
stdout_logfile_maxbytes=0                ; 변경됨: 로그 회전 없이 스트리밍만
stderr_logfile=/dev/stderr               ; 변경됨: Docker STDERR으로 출력
environment=PORT="3001"
