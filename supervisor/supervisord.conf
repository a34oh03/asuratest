; supervisord.conf: nginx, next, nest 프로세스 관리
; 각 프로세스는 예외 발생 시 재시작
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[program:nginx]
command=nginx -g 'daemon off;'
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/nginx-supervisor.log

[program:frontend]
directory=/frontend
command=sh -c "pnpm run start"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/frontend/next-supervisor.log
environment=PORT="3000"

[program:backend]
directory=/backend
command=sh -c "pnpm run start:prod"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/backend/nest-supervisor.log
environment=PORT="3001"
